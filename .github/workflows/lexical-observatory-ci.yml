name: Lexical Observatory security and behavior

on:
  push:
    branches: [main, max-lex-observatory-2026-10-16]
    paths:
      - museum-static/observatory/**
      - supabase/migrations/20261016_lexical_observatory.sql
      - scripts/*lexical*
      - scripts/dom-tests/**
      - scripts/fixtures/word_archive_schema.sql
      - .github/workflows/lexical-observatory-ci.yml
  pull_request:
    paths:
      - museum-static/observatory/**
      - supabase/migrations/20261016_lexical_observatory.sql
      - scripts/*lexical*
      - scripts/dom-tests/**
      - scripts/fixtures/word_archive_schema.sql
      - .github/workflows/lexical-observatory-ci.yml

permissions:
  contents: read

jobs:
  lexical-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: lexical_smoketest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexical_smoketest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: lexical_smoketest
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lexical image renderer
        run: python -m pip install 'Pillow>=12,<13' 'cairosvg>=2.7,<3'
      - name: Render approved lexical share assets
        run: python scripts/build_lexical_publication.py --input museum-static/observatory/public.json --write
      - name: Render public project thumbnails before release checks
        run: python scripts/render_project_brand_assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/dom-tests/package-lock.json
      - name: Install isolated DOM test dependencies
        run: npm ci --prefix scripts/dom-tests --ignore-scripts --no-audit --no-fund
      - name: Public catalog, search, publication and Museum preservation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Actual public application interactions
        run: node scripts/test_lexical_dom.mjs
      - name: Lexical migration and anonymous/admin role matrix
        run: psql -v ON_ERROR_STOP=1 -f scripts/test_lexical_backend.sql
