name: Sync YouTube media

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main]
    paths:
      - scripts/sync_youtube.py
      - scripts/test_*.py
      - .github/workflows/youtube-sync.yml

permissions:
  contents: write

concurrency:
  group: youtube-media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify archive preservation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Install YouTube extractor
        run: python -m pip install --upgrade yt-dlp

      # The Pages workflow publishes successful syncs through workflow_run.
      # A GITHUB_TOKEN push alone does not trigger another push workflow.
      - name: Refresh public YouTube catalog
        run: python scripts/sync_youtube.py

      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- museum-static/data/youtube-media.js; then
            echo "No YouTube catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum-static/data/youtube-media.js
          git commit -m "Sync YouTube media snapshot"
          git push
