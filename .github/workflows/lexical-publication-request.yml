name: Publish owner-approved lexical request

# Submitting the prefilled PUBLIC issue is the owner's publication approval.
# Never execute code, command text, or a branch named inside an issue body.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-owner-request:
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' && github.actor == 'exemptus9' && github.event.issue.user.login == 'exemptus9' && github.repository == 'exemptus9/idunnopoetry-museum' && github.ref == 'refs/heads/main' && github.event.issue.title == 'Lexical Observatory: approved public change' && !github.event.issue.pull_request
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch current authoritative state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lexical image renderer
        run: python -m pip install 'Pillow>=12,<13'
      - name: Render approved lexical share assets
        run: python scripts/build_lexical_publication.py --input museum-static/observatory/public.json --write

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/dom-tests/package-lock.json
      - name: Install isolated DOM dependencies
        run: npm ci --prefix scripts/dom-tests --ignore-scripts --no-audit --no-fund

      - name: Validate the original owner issue approval
        run: python scripts/lexical_issue.py

      - name: Apply the explicitly approved public request
        run: python scripts/lexical_issue.py --write

      - name: Run complete archive and lexical regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cairosvg>=2.7,<3'
          python scripts/check_release.py --render-preview
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --check museum-static/observatory/app.js
          node --check museum-static/observatory/model.js
          node --check museum-static/observatory/review.js
          node scripts/test_lexical_dom.mjs
          if test -f scripts/test_lexical_lab_dom.mjs; then node scripts/test_lexical_lab_dom.mjs; fi
          python scripts/check_release.py --check

      - name: Commit approved public state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lexical Observatory editor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add museum-static/observatory
          if ! git diff --cached --quiet; then
            git commit -m 'Publish owner-approved lexical issue request'
            # A concurrent main push is a safe conflict, never a force-push.
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare complete public artifact
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a museum-static _site
          python scripts/inject_analytics.py _site/museum-config.js
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy the approved lexical request
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public assets
        env:
          MUSEUM_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_public_release.py
