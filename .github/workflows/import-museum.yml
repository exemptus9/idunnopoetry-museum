name: One-time import complete static museum

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-museum.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and unpack complete museum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-eaf4-81f5-9fe0-2783b2ab0585/raw?se=2026-09-23T12%3A33%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=cece6d21-1369-58f6-8037-a408337220d3&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T12%3A12%3A31Z&ske=2026-09-24T12%3A12%3A31Z&sks=b&skv=2026-02-06&sig=9e0bzEj7FztT5yflMJCm7XU5xZQq3ved8T01kWMIWoY%3D' -o museum.zip
          rm -rf museum-static unpacked
          unzip -q museum.zip -d unpacked
          mkdir -p museum-static
          cp -a unpacked/IDP_Messageboard_Museum/. museum-static/
          test -s museum-static/index.html
          test -s museum-static/data/posts.js
          echo "Imported $(du -sh museum-static | cut -f1) museum package"

      - name: Commit complete static museum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum-static
          git commit -m "Import complete static museum build v3.3"
          git push origin HEAD:main
