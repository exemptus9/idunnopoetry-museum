name: Museum private backend security

on:
  push:
    branches: [museum-secure-editorial-backend-2026-10-08]
    paths:
      - museum-static/**
      - supabase/**
      - scripts/test_museum_*
      - .github/workflows/museum-cms-ci.yml
  pull_request:
    paths:
      - museum-static/**
      - supabase/**
      - scripts/test_museum_*
      - .github/workflows/museum-cms-ci.yml

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: museum_smoketest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d museum_smoketest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: museum_smoketest
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lexical image renderer
        run: python -m pip install 'Pillow>=12,<13'
      - name: Render approved lexical share assets
        run: python scripts/build_lexical_publication.py --input museum-static/observatory/public.json --write

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/dom-tests/package-lock.json
      - name: Install isolated DOM test dependencies
        run: npm ci --prefix scripts/dom-tests --ignore-scripts --no-audit --no-fund

      - name: Static privacy and museum regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Browser script syntax
        run: |
          node --check museum-static/museum.js
          node --check museum-static/admin/admin.js
          node --check museum-static/admin/public-overlay.js
          node --check museum-static/admin/cms-config.js
          node scripts/test_museum_control_dom.mjs
      - name: Deployable static Museum release is internally consistent
        run: python scripts/check_release.py --source-only
      - name: PostgreSQL RLS + owner/editor/publication integration tests
        run: psql -v ON_ERROR_STOP=1 -f scripts/test_museum_backend.sql
