name: Museum private backend security

on:
  push:
    branches: [main, museum-secure-editorial-backend-2026-10-08]
    paths:
      - museum-static/**
      - supabase/**
      - scripts/test_museum_*
      - scripts/*preservation*
      - .github/workflows/museum-cms-ci.yml
  pull_request:
    paths:
      - museum-static/**
      - supabase/**
      - scripts/test_museum_*
      - scripts/*preservation*
      - .github/workflows/museum-cms-ci.yml

permissions:
  contents: read

jobs:
  backend-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: museum_smoketest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d museum_smoketest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: museum_smoketest
      PGUSER: postgres
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lexical image renderer
        run: python -m pip install 'Pillow>=12,<13' 'cairosvg>=2.7,<3'
      - name: Render approved lexical share assets
        run: python scripts/build_lexical_publication.py --input museum-static/observatory/public.json --write
      - name: Render public project thumbnails before release checks
        run: python scripts/render_project_brand_assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/dom-tests/package-lock.json
      - name: Install isolated DOM test dependencies
        run: npm ci --prefix scripts/dom-tests --ignore-scripts --no-audit --no-fund

      - name: Static privacy and museum regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Browser script syntax and existing editorial flows
        run: |
          node --check museum-static/museum.js
          node --check museum-static/admin/admin.js
          node --check museum-static/admin/navigator-core.js
          node --check museum-static/admin/public-overlay.js
          node --check museum-static/admin/cms-config.js
          node --check museum-static/admin/preservation-core.js
          node --check museum-static/admin/preservation-desk.js
          node scripts/test_museum_control_dom.mjs
          node scripts/test_museum_navigator_dom.mjs
          node scripts/test_preservation_core.cjs
      - name: Install pinned real-browser testing tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native browser preservation and privacy flows
        env:
          SCREENSHOT_DIR: test-artifacts/preservation
        run: python scripts/preservation_browser.py
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preservation-browser-evidence
          path: test-artifacts/preservation/
          retention-days: 7
          if-no-files-found: warn
      - name: Deployable static Museum release is internally consistent
        run: python scripts/check_release.py --source-only
      - name: PostgreSQL RLS + owner/editor/publication integration tests
        run: psql -v ON_ERROR_STOP=1 -f scripts/test_museum_backend.sql
