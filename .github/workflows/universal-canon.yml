name: Universal Writing Canon verification
on:
  pull_request:
    paths: ['museum-static/admin/canon/**', 'museum-static/canon/**', 'supabase/canon/**', 'scripts/canon/**', '.github/workflows/universal-canon.yml']
  push:
    branches: [main]
    paths: ['museum-static/admin/canon/**', 'museum-static/canon/**', 'supabase/canon/**', 'scripts/canon/**', '.github/workflows/universal-canon.yml']
permissions:
  contents: read
jobs:
  canonical-security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: canon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d canon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: canon_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exact text and transport invariants
        run: |
          node --check museum-static/admin/canon/app.js
          node --check museum-static/admin/canon/core.js
          node --check museum-static/canon/reader.js
          node scripts/canon/test-core.cjs
      - name: Disposable PostgreSQL authorization and recovery
        run: psql -v ON_ERROR_STOP=1 -f supabase/canon/test-canon.sql
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native browser canon workflow and privacy
        run: python scripts/canon/browser.py
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-canon-browser-evidence
          path: test-artifacts/canon/
          retention-days: 14
          if-no-files-found: warn
