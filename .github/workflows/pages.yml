name: Deploy museum to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - museum-static/**
      - scripts/check_release.py
      - scripts/verify_public_release.py
      - scripts/test_*.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Sync YouTube media]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A sync commits after its triggering SHA. Always publish latest main.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify archive preservation and scripts
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --check museum-static/museum.js
          node --check museum-static/version.js
          node --check museum-static/data/version-history.js

      - name: Render and verify release preview
        run: |
          python -m pip install 'cairosvg>=2.7,<3'
          python scripts/check_release.py --render-preview

      - name: Verify complete museum
        shell: bash
        run: |
          set -euo pipefail
          test -s museum-static/index.html
          test -s museum-static/data/core.js
          test -s museum-static/data/posts.js
          test -s museum-static/data/poetry.js
          python scripts/check_release.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deployable site and inject analytics token
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a museum-static _site
          if [[ -n "${CLOUDFLARE_ANALYTICS_TOKEN:-}" ]]; then
            python - <<'PY'
from pathlib import Path
import os, re
p=Path("_site/museum-config.js")
text=p.read_text(encoding="utf-8")
token=os.environ["CLOUDFLARE_ANALYTICS_TOKEN"].strip()
if not token:
    raise SystemExit(0)
text,n=re.subn(r"cloudflareAnalyticsToken:'[^']*'", "cloudflareAnalyticsToken:"+repr(token), text, count=1)
if n != 1:
    raise SystemExit("cloudflareAnalyticsToken placeholder not found")
p.write_text(text, encoding="utf-8")
print("Cloudflare Web Analytics token injected into deployment copy.")
PY
          else
            echo "Cloudflare Web Analytics remains disabled: no repository variable/secret configured."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public release
        env:
          MUSEUM_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_public_release.py
