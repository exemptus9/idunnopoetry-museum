name: Deploy museum to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - museum-static/**
      - scripts/check_release.py
      - scripts/verify_public_release.py
      - scripts/test_*.py
      - scripts/*preservation*
      - scripts/*canon*
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Sync YouTube media]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A sync commits after its triggering SHA. Always publish latest main.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lexical image renderer
        run: python -m pip install 'Pillow>=12,<13' 'cairosvg>=2.7,<3'
      - name: Render approved lexical share assets
        run: python scripts/build_lexical_publication.py --input museum-static/observatory/public.json --write
      - name: Render public project thumbnails before release checks
        run: python scripts/render_project_brand_assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/dom-tests/package-lock.json
      - name: Install isolated DOM test dependencies
        run: npm ci --prefix scripts/dom-tests --ignore-scripts --no-audit --no-fund

      - name: Verify archive preservation and scripts
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --check museum-static/museum.js
          node --check museum-static/version.js
          node --check museum-static/data/version-history.js
          node scripts/test_lexical_dom.mjs
          node --check museum-static/admin/admin.js
          node scripts/test_museum_control_dom.mjs
          node --check museum-static/admin/navigator-core.js
          node scripts/test_museum_navigator_dom.mjs
          node --check museum-static/admin/preservation-core.js
          node --check museum-static/admin/preservation-desk.js
          node scripts/test_preservation_core.cjs
          node --check museum-static/admin/canon/canon-core.js
          node --check museum-static/admin/canon/canon-app.js
          node --check museum-static/admin/canon-link.js
          node --check museum-static/canon/reader.js
          node scripts/test_universal_canon_core.cjs

      - name: Render and verify release preview
        run: |
          python -m pip install 'cairosvg>=2.7,<3'
          python scripts/check_release.py --render-preview

      - name: Verify complete museum
        shell: bash
        run: |
          set -euo pipefail
          test -s museum-static/index.html
          test -s museum-static/data/core.js
          test -s museum-static/data/posts.js
          test -s museum-static/data/poetry.js
          test -s museum-static/admin/canon/index.html
          test -s museum-static/canon/index.html
          python scripts/check_release.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build deployable site and inject analytics token
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a museum-static _site
          python scripts/inject_analytics.py _site/museum-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public release
        env:
          MUSEUM_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_public_release.py
