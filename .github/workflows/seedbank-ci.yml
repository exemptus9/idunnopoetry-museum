name: Seed Bank checks

on:
  pull_request:
    paths:
      - museum-static/**
      - scripts/import_approved_seeds.py
      - scripts/test_*.py
      - docs/SEEDBANK_WORKFLOW.md
      - .github/workflows/seedbank-ci.yml
  push:
    branches: [seedbank-curator-2026-10-08, main]
    paths:
      - museum-static/**
      - scripts/import_approved_seeds.py
      - scripts/test_*.py
      - .github/workflows/seedbank-ci.yml

permissions:
  contents: read

jobs:
  seedbank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit and privacy tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: JavaScript and release syntax
        run: |
          node --check museum-static/museum.js
          node --check museum-static/data/seedbank-approved.js
          node --check museum-static/data/version-history.js
          python scripts/check_release.py --source-only
